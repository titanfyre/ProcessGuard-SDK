[build-system]
requires=["setuptools>=77","wheel>=0.43"]
build-backend="setuptools.build_meta"
[project]
name="processguard-sdk"
version="1.0.0"
description="Windows x64 ProcessGuard-SDK direct SDK"
requires-python=">=3.10"
license="MIT"
readme="README.md"
[project.urls]
Repository="https://github.com/titanfyre/ProcessGuard-SDK"
[tool.setuptools]
packages=["processguard_sdk"]
[tool.setuptools.package-data]
processguard_sdk=["*.dll"]
[tool.setuptools.data-files]
"share/processguard-sdk/docs"=["docs/*","LICENSE"]
